<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ĐỀ XUẤT THAY ĐỔI GIÁ THỂ VI SINH</title></head><body><div style="font-family:Arial;padding:20px">Đang tải báo cáo...</div><script>(async()=>{const n=12;const a=[];for(let i=0;i<n;i++){a.push(fetch(`parts/part${String(i).padStart(2,'0')}.txt`).then(r=>r.text()))}const s=(await Promise.all(a)).join('');document.open();document.write(s);document.close()})().catch(e=>document.body.innerHTML='<pre>Không thể tải báo cáo: '+e+'</pre>');</script></body></html>
